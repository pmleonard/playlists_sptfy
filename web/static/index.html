<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>playlist-web</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>playlist-web</h1>
    <nav id="tabs">
      <button class="tab-btn" data-tab="songs">Songs</button>
      <button class="tab-btn" data-tab="update">Update</button>
      <button class="tab-btn" data-tab="import">Import</button>
      <button class="tab-btn" data-tab="export">Export</button>
      <button class="tab-btn" data-tab="genres">Genres</button>
      <button class="tab-btn" data-tab="tags">Eras</button>
      <button class="tab-btn" data-tab="albums">Albums</button>
      <button class="tab-btn" data-tab="grouped_songs">Grouped Songs</button>
      <button class="tab-btn" data-tab="ignore_duplicates">Ignored Duplicates</button>
      <button class="tab-btn" data-tab="possible_duplicates">Possible Duplicates</button>
      <button class="tab-btn" data-tab="config">Config</button>
      <button class="tab-btn" data-tab="settings">Settings</button>
    </nav>
  </header>
  <main id="content"></main>
  <div id="toast-container"></div>
  <script type="module" src="/static/app.js"></script>

</html>
